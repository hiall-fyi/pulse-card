name: Bug report
description: Something in a Pulse Card isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. A screenshot and your card
        YAML make the biggest difference; browser console errors (F12 →
        Console) are the next most useful thing if the card is rendering
        nothing or looks broken.
  - type: checkboxes
    attributes:
      label: Before you start
      options:
        - label: I have searched the existing issues and discussions for this
          required: true
  - type: dropdown
    id: card
    attributes:
      label: Which card?
      options:
        - Pulse Bar Card
        - Pulse Climate Card
        - Pulse Weather Card
        - Not sure
    validations:
      required: true
  - type: input
    id: pulse_card_version
    attributes:
      label: Pulse Card version
      description: Shown in the card's visual editor, or check the version badge in the README.
      placeholder: e.g. 1.9.2
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: e.g. 2026.7.1
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: e.g. Chrome 128 on macOS, or the Home Assistant Companion app on iOS
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        **Using the Climate Card's Tado CE chips** (heating-circuit, comfort strip,
        or similar)? If a chip shows the wrong value rather than being missing
        entirely, that's worth checking against [Tado CE](https://github.com/hiall-fyi/tado_ce)'s
        own issues too, since it may be a Tado CE bug rather than a card one.
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What actually happened?
    validations:
      required: true
  - type: textarea
    id: card_config
    attributes:
      label: Card configuration (YAML)
      description: The card's config from your dashboard's YAML editor. Redact anything private; entity names are usually fine, tokens and URLs aren't.
      render: yaml
    validations:
      required: true
  - type: textarea
    id: console_errors
    attributes:
      label: Browser console errors
      description: >
        Open dev tools (F12, or Cmd+Option+I on Mac) → Console tab, reload
        the dashboard, and paste anything in red. Not required, but a card
        that renders nothing or looks broken almost always logs something here.
      render: text
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce (if you can)
  - type: textarea
    id: already_tried
    attributes:
      label: What have you already tried?
      placeholder: e.g. hard-refreshed the browser (Cmd/Ctrl+Shift+R), removed and re-added the card, tried a different browser
